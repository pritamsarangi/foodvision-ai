services:
  api:
    build:
      context: ./backend
    container_name: foodvision_api
    expose:
      - "8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./ml/experiments/efficientnet_b0:/app/ml/experiments/efficientnet_b0:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: foodvision_caddy
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
    restart: unless-stopped