services:
  # Internal FastAPI Application
  api:
    build:
      context: ./backend
    container_name: foodvision_api
    expose:
      - "8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./ml/experiments/efficientnet_b0:/app/ml/experiments/efficientnet_b0:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Public Edge Reverse Proxy
  caddy:
    image: caddy:2-alpine
    container_name: foodvision_caddy
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
